[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp2term-client"
version = "0.1.0"
description = "Xonsh-based remote client for the mcp2term MCP server"
readme = "README.md"
authors = [{name = "mcp2term maintainers"}]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.5",
    "httpx>=0.27",
    "mcp>=0.3.0",
]

[project.scripts]
mcp2term-client = "mcp2term_client.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp2term_client"]
